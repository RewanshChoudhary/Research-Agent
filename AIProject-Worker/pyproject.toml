[project]
name = "aiproject-worker"
version = "0.1.0"
description = "A multi agent worker for research"
authors = [
    {name = "Rewansh Choudhary",email = "rewanshchoudhary57@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2,<3.0.0",
    "structlog>=25.5.0,<26.0.0",
    "redis>=7.4.0,<8.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    "openai>=2.38.0,<3.0.0",
    "tenacity>=9.1.4,<10.0.0",
    "duckduckgo-search>=8.1.1,<9.0.0",
    "beautifulsoup4>=4.14.3,<5.0.0",
    "ddg (>=0.2.2,<0.3.0)"
]

[tool.poetry]
packages = [
    { include = "worker" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
