spring.application.name=AIproject

# Load local .env file as key/value properties (optional for local dev).
spring.config.import=optional:file:.env[.properties]

# Redis connection (auto-configured by Spring Boot).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Redis stream names for asynchronous research job processing.
app.research.redis.streams.job-stream-name=${REDIS_JOB_STREAM:research:jobs:stream}
app.research.redis.streams.job-consumer-group=${REDIS_JOB_GROUP:research:workers}
app.research.redis.streams.dead-letter-stream-name=${REDIS_DEAD_STREAM:research:jobs:dead}
app.worker.token=${WORKER_TOKEN:dev-worker-secret}
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}}
spring.datasource.username=${DB_USERNAME:researchagent}
spring.datasource.password=${DB_PASSWORD:researchagent}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

logging.level.com.example_Real_Time_Data_Streaming=DEBUG
