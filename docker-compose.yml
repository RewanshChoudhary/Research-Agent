

services:
  postgres:
    image: postgres:16
    container_name: research-agent-postgres
    restart: no

    environment:
      POSTGRES_DB: ${DB_NAME:-researchagent}
      POSTGRES_USER: ${DB_USERNAME:-researchagent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-researchagent}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-researchagent} -d ${DB_NAME:-researchagent}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: research-agent-redis
    restart: no

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.38.2
    container_name: research-agent-weaviate
    restart: no

    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
      QUERY_DEFAULTS_LIMIT: 20
      GRPC_PORT: 50051

    ports:
      - "${WEAVIATE_HTTP_PORT:-8081}:8080"
      - "${WEAVIATE_GRPC_PORT:-50051}:50051"

    volumes:
      - weaviate_data:/var/lib/weaviate

    # Uses the built-in readiness endpoint instead of curl
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./AIproject

    container_name: research-agent-api
    restart: no
    init: true

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-researchagent}
      DB_USERNAME: ${DB_USERNAME:-researchagent}
      DB_PASSWORD: ${DB_PASSWORD:-researchagent}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      REDIS_JOB_STREAM: ${REDIS_JOB_STREAM:-research:jobs:stream}
      REDIS_JOB_GROUP: ${REDIS_JOB_GROUP:-research:workers}
      REDIS_DEAD_STREAM: ${REDIS_DEAD_STREAM:-research:jobs:dead}

      WORKER_TOKEN: ${WORKER_TOKEN:-dev-worker-secret}

    ports:
      - "${API_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy

  worker:
    build:
      context: ./AIProject-Worker

    container_name: research-agent-worker
    restart: no
    init: true

    extra_hosts:
      - host.docker.internal:host-gateway

    environment:
      JAVA_SERVER_URL: http://api:8080

      WORKER_TOKEN: ${WORKER_TOKEN:-dev-worker-secret}

      REDIS_URL: redis://redis:6379/0
      REDIS_JOB_STREAM: ${REDIS_JOB_STREAM:-research:jobs:stream}
      REDIS_JOB_GROUP: ${REDIS_JOB_GROUP:-research:workers}
      REDIS_CONSUMER_NAME: ${REDIS_CONSUMER_NAME:-worker-1}

      GROQ_API_KEY: ${GROQ_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY:-${GROQ_API_KEY}}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama3-groq-8b-8192-tool-use-preview}

      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_GRPC_PORT: 50051

      # Context window for the deployed model — must match LLM_MODEL.
      # llama3-groq-8b-8192 → 8192   |  llama-3.3-70b-versatile → 128000
      MAX_CONTEXT_TOKENS: ${MAX_CONTEXT_TOKENS:-8192}
      RESERVED_OUTPUT_TOKENS: ${RESERVED_OUTPUT_TOKENS:-1024}

      # How many LLM calls may be in-flight process-wide at once.
      # Lower this if you see provider 429s; raise it for large-context APIs.
      LLM_GLOBAL_CONCURRENCY: ${LLM_GLOBAL_CONCURRENCY:-5}

      # How many research jobs may run concurrently in this worker process.
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}

    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    container_name: research-agent-frontend
    restart: no

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
